<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RKZ Package CareTrack — Prototype</title>
<style>
:root{
  --nav:#0b1f3a; --nav2:#12395c; --teal:#119da4; --teal2:#0f7f86;
  --purple:#7c5ce6; --orange:#f59e0b; --red:#e85d75; --green:#38a169;
  --bg:#f5f8fc; --card:#fff; --line:#dfe7f1; --text:#1f2937; --muted:#6b7280;
  --shadow:0 10px 30px rgba(26,46,74,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--nav),#071628);color:white;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#19b5b8,#7c5ce6);display:grid;place-items:center;font-weight:900}
.unitbox{background:rgba(255,255,255,.08);padding:12px;border-radius:12px;margin-bottom:18px}
.unitbox label{font-size:11px;color:#b9c7d7;text-transform:uppercase}
.unitbox select{margin-top:6px;width:100%;background:#102f4e;color:white;border:1px solid #31506f;border-radius:8px;padding:9px}
.nav a{display:flex;gap:10px;align-items:center;color:#d6e1eb;text-decoration:none;padding:11px 12px;border-radius:10px;margin:3px 0;font-size:14px}
.nav a.active,.nav a:hover{background:#0f8791;color:white}
.usercard{position:absolute;left:16px;right:16px;bottom:18px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;font-size:12px;color:#c7d3df}
.main{padding:24px 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title h1{font-size:24px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:white}
.btn.purple{background:var(--purple);border-color:var(--purple);color:white}
.btn.orange{background:var(--orange);border-color:var(--orange);color:white}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:16px}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}.kpi .num{font-size:26px;font-weight:800;margin:6px 0}.kpi .sub{font-size:12px;color:var(--muted)}
.cols2{grid-template-columns:1.55fr 1fr;margin-top:14px}
.pad{padding:18px}
.chart{height:220px;display:flex;align-items:flex-end;gap:10px;padding:18px 8px 28px;border-bottom:1px solid var(--line);position:relative}
.bar{flex:1;background:linear-gradient(#15b1b8,#0f7f86);border-radius:6px 6px 0 0;min-width:12px;position:relative}
.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.donut{width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--green) 0 34%,var(--teal) 34% 72%,var(--orange) 72% 89%,var(--red) 89%);position:relative;margin:22px auto}
.donut:after{content:"";position:absolute;inset:28px;background:white;border-radius:50%}
.donut b{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:24px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8fafc;color:#52606d;text-align:left;padding:10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #edf2f7}
tr:hover td{background:#fbfdff}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:700}
.bgreen{background:#e8f7ec;color:#23834a}.borange{background:#fff2df;color:#b96500}.bblue{background:#e8f2ff;color:#2b63b8}.bred{background:#ffe8ee;color:#b73858}
.section{display:none}.section.active{display:block}
.searchrow{display:flex;gap:8px;margin:10px 0 14px}
.searchrow input,.searchrow select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 11px}
.searchrow input{flex:1}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.panel-title h3{margin:0;font-size:16px}
.patient-head{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.info{padding:18px}.info h2{margin:0 0 4px}.muted{color:var(--muted);font-size:12px}
.progress{height:12px;background:#e8eef5;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--teal),#37c3c7)}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white}
.field textarea{min-height:78px}
.follow-card{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.follow-card:last-child{border-bottom:none}
.follow-left b{display:block}.follow-left small{color:var(--muted)}
.role-note{padding:10px 12px;border-left:4px solid var(--teal);background:#eefafb;border-radius:8px;margin-bottom:14px;font-size:12px}
.admin-note{border-left-color:var(--orange);background:#fff7e8}
.modal{position:fixed;inset:0;background:rgba(8,21,37,.45);display:none;place-items:center;padding:20px;z-index:20}
.modal.show{display:grid}.modalbox{width:min(760px,100%);background:white;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.2);padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#eef2f7;border-radius:50%;width:32px;height:32px;cursor:pointer}
.small{font-size:11px}
@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.cols2,.patient-head,.comp-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">RKZ</div><div>Package CareTrack</div></div>
    <div class="unitbox">
      <label>Tampilan pengguna</label>
      <select id="roleSelect" onchange="switchRole()">
        <option value="tms">Unit Rawat Jalan — TMS</option>
        <option value="fisio">Unit Fisioterapi</option>
        <option value="admin">Admin / Manajemen</option>
      </select>
    </div>
    <nav class="nav">
      <a href="#" class="active" data-go="dashboard">▣ Dashboard</a>
      <a href="#" data-go="patients">◉ Pasien & Paket</a>
      <a href="#" data-go="usage">✎ Pencatatan Penggunaan</a>
      <a href="#" data-go="followup">⏰ Follow Up</a>
      <a href="#" data-go="reports">▤ Laporan</a>
    </nav>
    <div class="usercard"><b id="userLabel">Petugas Rawat Jalan</b><br><span id="accessLabel">Akses: TMS saja</span></div>
  </aside>

  <main class="main">
    <section id="dashboard" class="section active"></section>
    <section id="patients" class="section"></section>
    <section id="usage" class="section"></section>
    <section id="followup" class="section"></section>
    <section id="reports" class="section"></section>
  </main>
</div>

<div class="modal" id="detailModal">
  <div class="modalbox">
    <div class="modalhead"><h3>Detail Paket Pasien</h3><button class="x" onclick="closeModal()">×</button></div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="modal" id="formModal">
  <div class="modalbox">
    <div class="modalhead"><h3 id="formTitle">Tambah Paket</h3><button class="x" onclick="closeForm()">×</button></div>
    <div id="formContent"></div>
  </div>
</div>

<script>
let data={tms:[],fisio:[]};
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
let role='tms';

async function api(method,payload){
 let url='api.php',opt={method,headers:{'Content-Type':'application/json'}};
 if(method==='DELETE') url+='?unit='+encodeURIComponent(payload.unit)+'&id='+encodeURIComponent(payload.id);
 else if(method!=='GET') opt.body=JSON.stringify(payload);
 const r=await fetch(url,opt);
 const j=await r.json();
 if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
 return j;
}
async function loadData(){
 try{data=await api('GET')}catch(e){alert('Gagal memuat data.json. Jalankan lewat http://localhost/pakettracker/\n\n'+e.message)}
 renderAll();
}
function fmt(d){if(!d||d==='-')return '-';const p=String(d).split('-');return p.length===3?`${p[2]} ${BLN[+p[1]-1]} ${p[0]}`:d}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function findUnit(id){return data.tms.some(x=>x.id===id)?'tms':'fisio'}
function allItems(){return [...data.tms,...data.fisio]}

document.querySelectorAll('.nav a').forEach(a=>a.onclick=(e)=>{e.preventDefault();document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');show(a.dataset.go)});

function statusBadge(s){
 let c=s==='Selesai'?'bgreen':s==='Hampir Habis'?'borange':s==='Belum Digunakan'?'bblue':s==='Expired'?'bred':'bgreen';
 return `<span class="badge ${c}">${s}</span>`;
}
function currentRows(){
 if(role==='admin') return [...data.tms.map(x=>({...x,unit:'Rawat Jalan — TMS'})),...data.fisio.map(x=>({...x,unit:'Fisioterapi'}))];
 return data[role].map(x=>({...x,unit:role==='tms'?'Rawat Jalan — TMS':'Fisioterapi'}));
}
function header(title,subtitle=''){
 return `<div class="topbar"><div class="title"><h1>${title}</h1><p>${subtitle}</p></div><div class="actions"><button class="btn">01 Agu 2026 - 31 Agu 2026</button><button class="btn">Filter</button></div></div>`;
}
function kpis(rows){
 const active=rows.filter(x=>x.status!=='Selesai').length, used=rows.filter(x=>x.used>0).length, almost=rows.filter(x=>x.status==='Hampir Habis').length, unused=rows.filter(x=>x.used===0).length;
 return `<div class="grid kpis">
 ${[['Paket aktif',active,'Pasien'],['Paket digunakan',used,Math.round(used/rows.length*100)+'% dari data'],['Hampir habis',almost,'Perlu follow up'],['Belum digunakan',unused,'Perlu follow up'],['Selesai',rows.filter(x=>x.status==='Selesai').length,'Paket selesai']].map((x,i)=>`<div class="card kpi"><div class="lab">${x[0]}</div><div class="num">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}
 </div>`;
}
function renderDashboard(){
 const rows=currentRows(), unit=role==='tms'?'Unit Rawat Jalan — TMS':role==='fisio'?'Unit Fisioterapi':'Admin / Manajemen — Semua Unit';
 document.getElementById('dashboard').innerHTML=header('Dashboard '+unit,'Monitoring penggunaan paket layanan')+
 (role==='admin'?`<div class="role-note admin-note"><b>Akses manajemen:</b> dapat melihat dashboard gabungan seluruh unit dan membandingkan utilisasi paket.</div>`:`<div class="role-note"><b>Data isolated:</b> pengguna unit hanya melihat pasien dan paket milik unitnya sendiri.</div>`)+
 kpis(rows)+`
 <div class="grid cols2">
  <div class="card pad"><div class="panel-title"><h3>Penggunaan Paket per Periode</h3><span class="muted">Agustus 2026</span></div>
   <div class="chart">${[28,42,49,63,58,72,80,69,88,96].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${i+1}</span></div>`).join('')}</div>
  </div>
  <div class="card pad"><div class="panel-title"><h3>Status Paket</h3></div><div class="donut"><b>${rows.length}</b></div></div>
 </div>
 <div class="card pad" style="margin-top:14px"><div class="panel-title"><h3>Pasien Perlu Follow Up</h3><button class="btn" onclick="show('followup')">Lihat semua</button></div>
   ${rows.filter(x=>x.status==='Hampir Habis'||x.status==='Belum Digunakan').slice(0,4).map(x=>`<div class="follow-card"><div class="follow-left"><b>${x.name}</b><small>${x.pkg} • Sisa ${x.total-x.used} • Terakhir: ${fmt(x.last)}</small></div><button class="btn orange" onclick="show('usage')">Catat</button></div>`).join('')}
 </div>`;
}
function renderPatients(){
 const rows=currentRows();
 document.getElementById('patients').innerHTML=header('Pasien & Paket','Daftar transaksi paket yang dapat diakses oleh unit ini')+
 `<div class="card pad"><div class="searchrow"><input placeholder="Cari nama / No. RM / No. Paket" oninput="filterTable(this.value)"><select><option>Semua status</option><option>Aktif</option><option>Hampir Habis</option><option>Belum Digunakan</option></select><button class="btn primary" onclick="openForm()">+ Paket Baru</button></div>
 <div class="tablewrap"><table id="patientTable"><thead><tr>${role==='admin'?'<th>Unit</th>':''}<th>No. Paket</th><th>Pasien</th><th>Paket</th><th>Tgl Beli</th><th>Terpakai</th><th>Sisa</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
 ${rows.map(x=>`<tr>${role==='admin'?`<td>${x.unit}</td>`:''}<td>${x.id}</td><td><b>${x.name}</b><br><span class="muted">${x.rm}</span></td><td>${x.pkg}</td><td>${fmt(x.buy)}</td><td>${x.used}x</td><td>${x.total-x.used}x</td><td>${statusBadge(x.status)}</td><td style="white-space:nowrap"><button class="btn" onclick="openDetail('${x.id}')">Detail</button> <button class="btn purple" onclick="openForm('${x.id}')">Ubah</button> <button class="btn" style="color:#b73858;border-color:#f3c6d1" onclick="delItem('${x.id}')">Hapus</button></td></tr>`).join('')}
 </tbody></table></div></div>`;
}
function renderUsage(){
 const rows=currentRows().filter(x=>x.status!=='Selesai');
 document.getElementById('usage').innerHTML=header('Pencatatan Penggunaan','Catat setiap tindakan yang menggunakan saldo paket')+
 `<div class="card pad"><div class="formgrid">
 <div class="field"><label>Pasien / No. RM</label><select id="usagePatient" onchange="populateComponents()">${rows.map(x=>`<option value="${x.id}">${x.name} — ${x.pkg} (sisa ${x.total-x.used}x)</option>`).join('')}</select></div>
 <div class="field"><label>Tanggal</label><input type="date" id="usageDate" value="${todayISO()}"></div>
 <div class="field"><label>Tindakan dari Master RS</label><select id="componentSelect"></select></div>
 <div class="field"><label>Jumlah pemakaian</label><input type="number" id="usageQty" value="1" min="1"></div>
 <div class="field"><label>Petugas</label><input id="usageOfficer" value="${role==='fisio'?'Siti Aisyah, S.Ft':'dr. Rina'}"></div>
 <div class="field"><label>Catatan</label><textarea id="usageNote" placeholder="Opsional"></textarea></div>
 </div><div style="text-align:right;margin-top:14px"><button class="btn primary" onclick="saveUsage()">Simpan Penggunaan</button></div></div>`;
 setTimeout(populateComponents,0);
}
function populateComponents(){
 const id=document.getElementById('usagePatient')?.value; if(!id)return;
 const x=allItems().find(r=>r.id===id); const el=document.getElementById('componentSelect');
 if(x&&x.comp) el.innerHTML=x.comp.map((c,i)=>[c,i]).filter(([c])=>c[1]-c[2]>0).map(([c,i])=>`<option value="${i}">${c[0]} — sisa ${c[1]-c[2]}x</option>`).join('');
 else el.innerHTML=`<option value="-">TMS — dari Master Tindakan RS</option>`;
}
async function saveUsage(){
 const id=document.getElementById('usagePatient')?.value; if(!id)return;
 const unit=findUnit(id), item=data[unit].find(x=>x.id===id); if(!item)return;
 const qty=Math.max(1,+document.getElementById('usageQty').value||1);
 const date=document.getElementById('usageDate').value||todayISO();
 const sisa=item.total-item.used;
 if(sisa<=0){alert('Saldo paket sudah habis.');return}
 const useQty=Math.min(qty,sisa);
 let tindakan='TMS';
 if(item.comp){
  const ci=+document.getElementById('componentSelect').value;
  const c=item.comp[ci];
  if(!c){alert('Pilih tindakan yang masih memiliki saldo.');return}
  if(useQty>c[1]-c[2]){alert(`Saldo komponen ${c[0]} hanya sisa ${c[1]-c[2]}x.`);return}
  c[2]+=useQty; tindakan=c[0];
 }
 item.used+=useQty; item.last=date;
 (item.log??=[]).push({date,tindakan,jumlah:useQty,petugas:document.getElementById('usageOfficer').value.trim(),note:document.getElementById('usageNote').value.trim()});
 try{
  await api('PUT',{unit,id,item});
  data=await api('GET'); renderAll();
  alert(`Penggunaan dicatat: ${item.name} • ${tindakan} ${useQty}x. Sisa saldo ${item.total-item.used} sesi.`);
 }catch(e){alert(e.message)}
}
function renderFollowup(){
 const rows=currentRows().filter(x=>x.status==='Hampir Habis'||x.status==='Belum Digunakan'||(x.total-x.used>0&&x.used>0));
 document.getElementById('followup').innerHTML=header('Follow Up List','Daftar pasien yang memerlukan tindak lanjut')+
 `<div class="card pad">${rows.map(x=>`<div class="follow-card"><div class="follow-left"><b>${x.name}</b><small>${x.unit} • ${x.pkg} • Sisa ${x.total-x.used}x • Terakhir: ${fmt(x.last)}</small></div><div><span class="badge ${x.status==='Belum Digunakan'?'bblue':'borange'}">${x.status}</span> <button class="btn primary" onclick="show('usage')">Follow Up</button></div></div>`).join('')||'<p class="muted">Tidak ada pasien yang perlu follow up.</p>'}</div>`;
}
function renderReports(){
 const rows=currentRows(); const totalEnt=rows.reduce((a,b)=>a+b.total,0), used=rows.reduce((a,b)=>a+b.used,0);
 document.getElementById('reports').innerHTML=header('Laporan & Evaluasi','Ringkasan utilisasi paket untuk evaluasi unit')+
 `<div class="grid kpis">
 <div class="card kpi"><div class="lab">Total hak tindakan</div><div class="num">${totalEnt}</div><div class="sub">Seluruh paket</div></div>
 <div class="card kpi"><div class="lab">Sudah digunakan</div><div class="num">${used}</div><div class="sub">${Math.round(used/totalEnt*100)}% utilization</div></div>
 <div class="card kpi"><div class="lab">Sisa tindakan</div><div class="num">${totalEnt-used}</div><div class="sub">Masih dapat digunakan</div></div>
 <div class="card kpi"><div class="lab">Completion rate</div><div class="num">${Math.round(rows.filter(x=>x.status==='Selesai').length/rows.length*100)}%</div><div class="sub">Paket selesai</div></div>
 <div class="card kpi"><div class="lab">Perlu follow up</div><div class="num">${rows.filter(x=>x.status==='Hampir Habis'||x.status==='Belum Digunakan').length}</div><div class="sub">Pasien</div></div>
 </div>
 <div class="card pad" style="margin-top:14px"><div class="panel-title"><h3>Evaluasi per Paket</h3></div><table><thead><tr><th>Paket</th><th>Terjual</th><th>Total Hak</th><th>Terpakai</th><th>Sisa</th><th>% Utilisasi</th></tr></thead><tbody>
 ${Object.entries(rows.reduce((acc,x)=>{acc[x.pkg]??={n:0,total:0,used:0};acc[x.pkg].n++;acc[x.pkg].total+=x.total;acc[x.pkg].used+=x.used;return acc},{})).map(([p,v])=>`<tr><td>${p}</td><td>${v.n}</td><td>${v.total}</td><td>${v.used}</td><td>${v.total-v.used}</td><td><b>${Math.round(v.used/v.total*100)}%</b></td></tr>`).join('')}
 </tbody></table></div>`;
}
function renderAll(){renderDashboard();renderPatients();renderUsage();renderFollowup();renderReports()}
function switchRole(){
 role=document.getElementById('roleSelect').value;
 document.getElementById('userLabel').textContent=role==='tms'?'Petugas Rawat Jalan':role==='fisio'?'Petugas Fisioterapi':'Admin / Manajemen';
 document.getElementById('accessLabel').textContent=role==='tms'?'Akses: TMS saja':role==='fisio'?'Akses: Fisioterapi saja':'Akses: Semua unit';
 renderAll(); show('dashboard');
 document.querySelectorAll('.nav a').forEach((x,i)=>x.classList.toggle('active',i===0));
}
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function filterTable(q){
 q=q.toLowerCase(); document.querySelectorAll('#patientTable tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none');
}
function openDetail(id){
 const x=allItems().find(r=>r.id===id); if(!x)return;
 let comp=x.comp?`<div class="card pad"><h4>Komponen Paket</h4><table><thead><tr><th>Tindakan</th><th>Hak</th><th>Terpakai</th><th>Sisa</th></tr></thead><tbody>${x.comp.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}x</td><td>${c[2]}x</td><td>${c[1]-c[2]}x</td></tr>`).join('')}</tbody></table></div>`:
 `<div class="card pad"><h4>Komponen Paket</h4><p><b>TMS</b> — hak ${x.total} sesi; terpakai ${x.used}; sisa ${x.total-x.used}.</p></div>`;
 const hist=(x.log||[]).map(l=>`<tr><td>${fmt(l.date)}</td><td>${l.tindakan}</td><td>${l.jumlah}x • ${l.petugas||'-'}${l.note?' — '+l.note:''}</td></tr>`).join('')||'<tr><td colspan=3>Belum ada penggunaan</td></tr>';
 document.getElementById('modalContent').innerHTML=`<div class="patient-head" style="margin-top:12px"><div class="card info"><h2>${x.name}</h2><div class="muted">No. RM ${x.rm}</div><p><b>${x.pkg}</b><br>No. Paket ${x.id}<br>Beli ${fmt(x.buy)} • Berlaku s/d ${fmt(x.exp)}</p>${statusBadge(x.status)}</div><div class="card info"><div class="muted">TERPAKAI</div><div style="font-size:32px;font-weight:800">${x.used} / ${x.total}</div><div class="progress"><div style="width:${x.used/x.total*100}%"></div></div><p>Sisa <b>${x.total-x.used} sesi</b></p></div></div><div class="comp-grid">${comp}<div class="card pad"><h4>Riwayat Penggunaan</h4><table><thead><tr><th>Tanggal</th><th>Tindakan</th><th>Keterangan</th></tr></thead><tbody>${hist}</tbody></table></div></div>`;
 document.getElementById('detailModal').classList.add('show');
}
function closeModal(){document.getElementById('detailModal').classList.remove('show')}

const COMP_NAMES=['Terapi Manual','Exercise Therapy','Electrotherapy'];
let editingId=null,formUnit='tms';
function openForm(id){
 editingId=id||null;
 const baseUnits=role==='admin'?['tms','fisio']:[role];
 formUnit=id?findUnit(id):(document.getElementById('fUnit')?.value||baseUnits[0]);
 const x=id?allItems().find(r=>r.id===id):null;
 document.getElementById('formTitle').textContent=(id?'Ubah Paket — ':'Tambah Paket — ')+(formUnit==='fisio'?'Fisioterapi':'Rawat Jalan TMS');
 document.getElementById('formContent').innerHTML=`<div class="formgrid" style="margin-top:12px">
 ${!id&&role==='admin'?`<div class="field"><label>Unit</label><select id="fUnit" onchange="openForm()">${baseUnits.map(u=>`<option value="${u}"${u===formUnit?' selected':''}>${u==='tms'?'Rawat Jalan — TMS':'Fisioterapi'}</option>`).join('')}</select></div>`:''}
 <div class="field"><label>Nama Pasien *</label><input id="fName" value="${x?x.name:''}" placeholder="Nama lengkap"></div>
 <div class="field"><label>No. RM *</label><input id="fRm" value="${x?x.rm:''}" placeholder="00123456"></div>
 <div class="field"><label>Jenis Paket *</label><input id="fPkg" value="${x?x.pkg:(formUnit==='tms'?'TMS 10x':'Fisioterapi 5x')}" placeholder="cth: TMS 10x"></div>
 <div class="field"><label>Tanggal Beli *</label><input type="date" id="fBuy" value="${x?x.buy:todayISO()}"></div>
 <div class="field"><label>Berlaku s/d *</label><input type="date" id="fExp" value="${x?x.exp:''}"></div>
 ${formUnit==='tms'
  ?`<div class="field"><label>Jumlah Sesi / Hak *</label><input type="number" id="fTotal" min="1" value="${x?x.total:10}"></div>`
  :`<div class="field" style="grid-column:1/-1"><label>Komponen Paket (jumlah hak tiap tindakan) *</label><div class="formgrid">${COMP_NAMES.map((n,i)=>{const c=x&&(x.comp||[]).find(k=>k[0]===n);return `<input type="number" id="fComp${i}" min="0" placeholder="${n}" title="${n}" value="${c?c[1]:''}" oninput="syncCompTotal()">`}).join('')}<input id="fTotal" readonly value="${x?x.total:''}" placeholder="Total otomatis = jumlah komponen"></div></div>`}
 </div>
 ${id?`<p class="muted" style="margin-top:10px">Terpakai <b>${x.used}x</b> dari total hak — riwayat penggunaan tidak berubah saat mengubah data paket.</p>`:''}
 <div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeForm()">Batal</button> <button class="btn primary" onclick="saveForm()">${id?'Simpan Perubahan':'Tambah Paket'}</button></div>`;
 document.getElementById('formModal').classList.add('show');
}
function syncCompTotal(){
 let s=0;COMP_NAMES.forEach((_,i)=>s+=+document.getElementById('fComp'+i).value||0);
 document.getElementById('fTotal').value=s||'';
}
function closeForm(){document.getElementById('formModal').classList.remove('show')}
async function saveForm(){
 if(editingId) formUnit=findUnit(editingId);
 const v=i=>document.getElementById(i)?.value.trim();
 const item={name:v('fName'),rm:v('fRm'),pkg:v('fPkg'),buy:v('fBuy'),exp:v('fExp'),total:+v('fTotal')||0};
 if(!item.name||!item.rm||!item.pkg){alert('Nama pasien, No. RM, dan jenis paket wajib diisi.');return}
 if(!item.buy||!item.exp){alert('Tanggal beli dan masa berlaku wajib diisi.');return}
 if(item.total<=0){alert(formUnit==='fisio'?'Isi minimal satu komponen paket dengan hak lebih dari 0.':'Jumlah sesi harus lebih dari 0.');return}
 if(item.exp<item.buy){alert('Tanggal kedaluwarsa tidak boleh sebelum tanggal beli.');return}
 try{
  if(editingId){
   await api('PUT',{unit:formUnit,id:editingId,item});
  }else{
   if(formUnit==='fisio') item.comp=COMP_NAMES.map((n,i)=>[n,+v('fComp'+i)||0,0]);
   await api('POST',{unit:formUnit,item});
  }
  closeForm();
  data=await api('GET'); renderAll(); show('patients');
 }catch(e){alert(e.message)}
}
async function delItem(id){
 const unit=findUnit(id), x=data[unit].find(r=>r.id===id);
 if(!confirm(`Hapus paket ${id} atas nama ${x?x.name:''}? Tindakan ini tidak dapat dibatalkan.`))return;
 try{
  await api('DELETE',{unit,id});
  data=await api('GET'); renderAll();
 }catch(e){alert(e.message)}
}
loadData();
</script>
</body>
</html>
